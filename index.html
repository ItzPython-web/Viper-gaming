<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Viper Gaming</title>

  <link rel="icon" href="img/site/logo.png">
  <link rel="stylesheet" href="css/index.css">

  <script>
    window.VIPER_BASE = "";
  </script>
</head>

<body>
  <div class="scrim"></div>

  <header class="topbar">
    <a href="index.html" class="topbar__logo">
      <img src="img/site/logo.png" alt="Viper">
    </a>

    <nav class="topbar__nav"></nav>
  </header>

  <main>
    <section class="hero">
      <img
        class="hero__banner"
        src="img/site/banner.png"
        alt="Viper"
      >

      <p class="hero__slogan">
        Premium Gaming, <em>Without the Premium Price.</em>
      </p>

      <div class="search">
        <form class="search__bar" id="searchForm">
          <svg
            class="search__icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="11" cy="11" r="7"></circle>
            <line
              x1="21"
              y1="21"
              x2="16.65"
              y2="16.65"
            ></line>
          </svg>

          <input
            class="search__input"
            id="searchInput"
            type="text"
            placeholder="Search mice, keyboards, mousepads..."
            autocomplete="off"
          >

          <button
            class="search__submit"
            type="submit"
            aria-label="Search"
          >
            <svg
              viewBox="0 0 24 24"
              width="18"
              height="18"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </form>

        <div class="search__status" id="searchStatus"></div>
        <div class="search__results" id="searchResults"></div>
      </div>
    </section>

    <section class="catalog" id="catalog">

      <div class="row" data-category="mousepads">
        <div class="row__head">
          <h2 class="row__title">Mousepads</h2>
          <div class="row__rule"></div>
        </div>

        <div
          class="product-grid"
          data-grid="mousepads"
        ></div>
      </div>

      <div class="row" data-category="keyboards">
        <div class="row__head">
          <h2 class="row__title">Keyboards</h2>
          <div class="row__rule"></div>
        </div>

        <div
          class="product-grid"
          data-grid="keyboards"
        ></div>
      </div>

      <div class="row" data-category="mice">
        <div class="row__head">
          <h2 class="row__title">Mice</h2>
          <div class="row__rule"></div>
        </div>

        <div
          class="product-grid"
          data-grid="mice"
        ></div>
      </div>

      <div class="row" data-category="coming-soon">
        <div class="row__head">
          <h2 class="row__title">Coming Soon</h2>
          <div class="row__rule"></div>
        </div>

        <div
          class="product-grid"
          data-grid="coming-soon"
        ></div>
      </div>

    </section>
  </main>

  <footer class="site-footer">
    Viper Gaming
  </footer>

  <!-- Load data first -->
  <script src="js/products-data.js" defer></script>

  <!-- Load VIPER after product data -->
  <script src="js/index.js" defer></script>

  <!-- Search after VIPER -->
  <script src="js/search.js" defer></script>

</body>
</html>
